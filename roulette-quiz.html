<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>輪盤抽人</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(135deg,#fff8e8,#fff0ee 55%,#edf4ff);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;color:#263247}
    .wrap{max-width:980px;margin:auto;padding:28px 18px 40px}
    .top{display:flex;justify-content:space-between;align-items:start}
    .top h1{margin:5px 0 8px;font-size:clamp(26px,3.5vw,38px);letter-spacing:-1px}
    .reset{border:1px solid #26324722;background:#ffffffb8;border-radius:99px;padding:9px 14px;font-weight:800;cursor:pointer}
    .grid{display:grid;grid-template-columns:1fr;gap:24px;margin-top:24px}
    .card{background:#ffffffdd;border:1px solid #fff;border-radius:28px;box-shadow:0 22px 55px #3f354725}
    .game{padding:30px;text-align:center}
    .stage{position:relative;width:min(100%,650px);aspect-ratio:1;margin:auto}
    .wheel{position:absolute;inset:6%;border:9px solid white;border-radius:50%;background:conic-gradient(from -18deg,#ff9c8f 0 36deg,#ffd56a 36deg 72deg,#8fc4ff 72deg 108deg,#a9d99a 108deg 144deg,#c5a4e8 144deg 180deg,#ffb57c 180deg 216deg,#82d6cf 216deg 252deg,#f39bc2 252deg 288deg,#a9b7ff 288deg 324deg,#f3c27b 324deg);box-shadow:0 12px 30px #2632472b}
    .n{position:absolute;left:50%;top:50%;width:16%;aspect-ratio:1;display:grid;place-items:center;color:#fff;font-size:clamp(16px,3vw,24px);font-weight:1000;text-shadow:0 2px 4px #26324799,0 0 2px #263247aa;transform:translate(-50%,-50%) rotate(var(--a)) translateY(-265%) rotate(calc(var(--a)*-1));user-select:none}
    .n.used{opacity:.28}
    .n{white-space:nowrap}
    .n.retry{font-size:clamp(11px,2.4vw,20px)}
    .hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:20%;aspect-ratio:1;border:6px solid white;border-radius:50%;background:#ff6f61;color:white;font-size:24px;box-shadow:0 6px 14px #85383a44}
    .pointer{position:absolute;z-index:2;left:50%;top:-2px;transform:translateX(-50%);border-left:18px solid transparent;border-right:18px solid transparent;border-top:32px solid #ff6f61;filter:drop-shadow(0 4px 3px #26324744)}
    .start{margin-top:18px;border:0;border-radius:99px;background:#ff6f61;color:white;padding:14px 34px;min-width:190px;font-size:18px;font-weight:900;box-shadow:0 9px 0 #e9544a;cursor:pointer}
    .start.stop{background:#5b8def;box-shadow:0 9px 0 #3f6fc8}
    .start:disabled{opacity:.5;cursor:not-allowed}
    .help{color:#7b8495;font-size:14px}
    .info{padding:28px}
    .info h2{margin:6px 0 22px;font-size:23px}
    .status{border-bottom:1px dashed #26324733;padding-bottom:14px;display:flex;justify-content:space-between;align-items:end}
    .status b{font-size:36px;color:#e9544a}
    .status span{color:#7b8495;font-size:14px}
    .list{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px;min-height:40px}
    .chip{min-height:38px;padding:0 12px;border-radius:99px;display:grid;place-items:center;background:#263247;color:white;font-weight:900}
    .empty{color:#7b8495;font-size:14px}
    .rules{margin-top:25px;padding:15px 16px;background:#ffc8572b;border-radius:17px;color:#5e6370;line-height:1.7;font-size:14px}
    .rules p{margin:0}
    .modal{position:fixed;inset:0;z-index:5;background:#1f263a8c;display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:.2s}
    .modal.open{opacity:1;visibility:visible}
    .box{position:relative;background:#fffaf0;border-radius:28px;padding:40px;max-width:600px;width:100%;box-shadow:0 25px 70px #1118274a}
    .close{position:absolute;right:15px;top:13px;border:0;border-radius:50%;width:35px;height:35px;background:#26324714;font-size:23px;cursor:pointer}
    .kicker{color:#e9544a;font-weight:900}
    .result{margin:12px 0 0;font-size:clamp(30px,6vw,48px);font-weight:900}
    .ok{display:block;margin:22px 0 0 auto;border:0;background:#263247;color:white;border-radius:99px;padding:11px 23px;font-weight:900;cursor:pointer}
    @media(max-width:750px){.grid{grid-template-columns:1fr}.info{order:-1}.game,.info{padding:20px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1>誰來唱歌</h1>
      </div>
      <!-- <button class="reset" id="reset">↻ 重頭</button> -->
    </header>

    <section class="grid">
      <section class="card game">
        <div class="stage">
          <div class="pointer"></div>
          <div class="wheel" id="wheel">
            <span class="n" style="--a:216deg">俊宏</span><span class="n" style="--a:0deg">育蕙</span>
            <span class="n" style="--a:36deg">景昌</span>
            <span class="n" style="--a:72deg">士億</span><span class="n" style="--a:108deg">家慈</span>
            <span class="n" style="--a:144deg">芑柔</span><span class="n" style="--a:252deg">峰欽</span>
            <span class="n" style="--a:180deg">惠蘭</span>
            <span class="n" style="--a:288deg">校長</span><span class="n retry" style="--a:324deg">再來一次</span>
            <span class="hub">✦</span>
          </div>
        </div>
        <button class="start" id="start">開始</button>
        <p class="help" id="help">按下「開始」轉動輪盤，再按「停止」。</p>
      </section>

      <aside class="card info">
        <h2>抽籤進度</h2>
        <div class="status"><b id="left">0</b><span>位已抽出</span></div>
        <div class="list" id="list"><span class="empty">還沒有人被抽到</span></div>
        <div class="rules"><p>🔁 想重新開始，請按右上角「重頭」。</p></div>
      </aside>
    </section>
  </main>

  <div class="modal" id="modal">
    <div class="box">
      <button class="close" id="close">×</button>
      <div class="kicker">本次結果</div>
      <p class="result" id="result"></p>
      <button class="ok" id="ok">知道了</button>
    </div>
  </div>

  <script>
    const eligible = ["俊宏", "峰欽", "校長"];
    const retryLabel = "再來一次";
    const storageKey = "roulette-people-v2";
    const readyMessage = "按下「開始」轉動輪盤，再按「停止」。";
    function randomRetryCount() {
      return 1 + Math.floor(Math.random() * 3);
    }

    let progress = { drawn: [], retriesLeft: randomRetryCount() };
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey) ??
        localStorage.getItem("roulette-people-v1"));
      if (saved && Array.isArray(saved.drawn) &&
          saved.drawn.every(name => eligible.includes(name)) &&
          new Set(saved.drawn).size === saved.drawn.length &&
          Number.isInteger(saved.retriesLeft) && saved.retriesLeft >= 0 && saved.retriesLeft <= 3) {
        if (localStorage.getItem(storageKey) !== null || saved.drawn.length > 0) {
          progress = saved;
        }
      }
    } catch (error) {}

    let spinning = false;
    let stopping = false;
    let wheelAnimation;
    const $ = id => document.getElementById(id);
    const wheel = $("wheel");
    const start = $("start");
    const help = $("help");
    const modal = $("modal");
    const nodes = [...document.querySelectorAll(".n")];

    const nameSlots = nodes.filter(node => node.textContent !== retryLabel);
    const names = nameSlots.map(node => node.textContent);
    for (let index = names.length - 1; index > 0; index -= 1) {
      const other = Math.floor(Math.random() * (index + 1));
      [names[index], names[other]] = [names[other], names[index]];
    }
    nameSlots.forEach((node, index) => { node.textContent = names[index]; });

    function saveProgress() {
      try { localStorage.setItem(storageKey, JSON.stringify(progress)); } catch (error) {}
    }

    function available() {
      return eligible.filter(name => !progress.drawn.includes(name));
    }

    function currentAngle() {
      const matrix = new DOMMatrixReadOnly(getComputedStyle(wheel).transform.replace(/^none$/, ""));
      return Math.atan2(matrix.b, matrix.a) * 180 / Math.PI;
    }

    function rotateWheel(from, to, options) {
      wheelAnimation?.cancel();
      wheelAnimation = wheel.animate([
        { transform: `rotate(${from}deg)` },
        { transform: `rotate(${to}deg)` }
      ], options);
      return wheelAnimation;
    }

    function update() {
      const { drawn } = progress;
      const finished = drawn.length === eligible.length;
      $("left").textContent = drawn.length;
      nodes.forEach(node => node.classList.toggle("used", drawn.includes(node.textContent)));
      $("list").innerHTML = drawn.length
        ? drawn.map(name => `<span class="chip">${name}</span>`).join("")
        : '<span class="empty">還沒有人被抽到</span>';
      start.disabled = finished;
      start.textContent = finished ? "抽完了" : "開始";
      help.textContent = finished ? "三位都抽完了，遊戲結束！" : readyMessage;
    }

    function showResult(result) {
      $("result").textContent = result;
      modal.classList.add("open");
    }

    function hideResult() { modal.classList.remove("open"); }

    async function stopWheel() {
      const remaining = available();
      const result = progress.retriesLeft > 0
        ? retryLabel
        : remaining[Math.floor(Math.random() * remaining.length)];
      const segment = nodes.find(node => node.textContent === result);
      const landingAngle = -parseFloat(segment.style.getPropertyValue("--a"));
      const now = currentAngle();
      const forward = ((landingAngle - now) % 360 + 360) % 360;
      stopping = true;
      help.textContent = "輪盤正在慢慢減速……";

      const stop = rotateWheel(now, now + 1440 + forward, {
        duration: 2450,
        easing: "cubic-bezier(.08,.76,.17,1)",
        fill: "forwards"
      });
      await stop.finished;
      wheel.style.transform = `rotate(${landingAngle}deg)`;
      stop.cancel();

      if (result === retryLabel) {
        progress.retriesLeft -= 1;
      } else {
        progress.drawn.push(result);
        progress.retriesLeft = available().length ? randomRetryCount() : 0;
      }
      saveProgress();
      stopping = false;
      spinning = false;
      start.classList.remove("stop");
      update();
      showResult(result);
    }

    start.onclick = () => {
      if (stopping) return;
      if (!spinning) {
        if (!available().length) return;
        const now = currentAngle();
        rotateWheel(now, now + 360, { duration: 420, iterations: Infinity });
        spinning = true;
        start.classList.add("stop");
        start.textContent = "停止";
        help.textContent = "按「停止」查看結果。";
      } else {
        return stopWheel();
      }
    };

    $("reset")?.addEventListener("click", () => {
      if (spinning || stopping) return;
      if (!confirm("確定要清除抽籤紀錄，重新開始嗎？")) return;
      progress = { drawn: [], retriesLeft: randomRetryCount() };
      saveProgress();
      rotateWheel(currentAngle(), 0, { duration: 450, easing: "ease" });
      wheel.style.transform = "rotate(0deg)";
      update();
    });

    $("close").onclick = hideResult;
    $("ok").onclick = hideResult;
    modal.onclick = event => { if (event.target === modal) hideResult(); };
    document.onkeydown = event => { if (event.key === "Escape") hideResult(); };
    update();
  </script>
</body>
</html>
